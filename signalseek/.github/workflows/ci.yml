name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r signalseek/apps/agent/requirements.txt
      - run: cd signalseek/apps/agent && python -m pytest -q
      - run: cd signalseek/apps/agent && ruff check app tests || true
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd signalseek/apps/api && npm install --no-audit --no-fund && npx tsc --noEmit
  web:
    runs-on: ubuntu-latest
